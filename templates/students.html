{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
  <h3>学生管理</h3>
  <a href="{{ url_for('add_student') }}" class="btn btn-primary">添加学生</a>
</div>

<table class="table table-bordered table-hover mt-3">
  <thead>
    <tr><th>ID</th><th>学号</th><th>姓名</th><th>班级</th><th>操作</th></tr>
  </thead>
  <tbody>
  {% for s in students %}
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.student_no }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.class_name }}</td>
      <td>
        <a href="{{ url_for('edit_student', id=s.id) }}" class="btn btn-sm btn-warning">编辑</a>
        <a href="{{ url_for('delete_student', id=s.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="5" class="text-center">暂无学生</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
