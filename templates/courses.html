{% extends 'base.html' %}
{% block content %}
<h3>课程管理</h3>

<form method="post" class="row g-3 mt-2">
  <div class="col-md-5">
    <input type="text" name="course_name" class="form-control" placeholder="课程名称" required>
  </div>
  <div class="col-md-3">
    <input type="number" step="0.5" name="credit" class="form-control" placeholder="学分">
  </div>
  <div class="col-md-2">
    <button type="submit" class="btn btn-primary">添加课程</button>
  </div>
</form>

<table class="table table-bordered mt-3">
  <thead>
    <tr><th>ID</th><th>课程名称</th><th>学分</th><th>操作</th></tr>
  </thead>
  <tbody>
  {% for c in courses %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.course_name }}</td>
      <td>{{ c.credit }}</td>
      <td>
        <a href="{{ url_for('delete_course', id=c.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="text-center">暂无课程</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
