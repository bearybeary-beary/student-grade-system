{% extends 'base.html' %}
{% block content %}
<h3>首页</h3>
<div class="row mt-3">
  <div class="col-md-4">
    <div class="card text-white bg-info mb-3">
      <div class="card-body">
        <h5>学生总数</h5>
        <p class="fs-3">{{ student_count }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-white bg-success mb-3">
      <div class="card-body">
        <h5>课程总数</h5>
        <p class="fs-3">{{ course_count }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-white bg-warning mb-3">
      <div class="card-body">
        <h5>成绩记录</h5>
        <p class="fs-3">{{ grade_count }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
